# Local infrastructure: one database.
#
# This used to bring up eight containers — Redis, Zookeeper, Kafka, MongoDB,
# Cassandra, OpenSearch and Jaeger alongside Postgres — because fifteen
# microservices needed them. Those services are gone, and with them the only
# reason a laptop had to run a Kafka broker to look at a mentor profile.
#
# The app is a Next.js server talking to Postgres. That is the whole stack.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: connectpro
      POSTGRES_PASSWORD: connectpro
      POSTGRES_DB: connectpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connectpro"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
