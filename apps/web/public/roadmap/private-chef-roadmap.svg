<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 2058" width="100%" role="img" aria-labelledby="rm-title rm-desc" preserveAspectRatio="xMidYMin meet" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="rm-title">How to become a private chef: a 7-step roadmap</title>
<desc id="rm-desc">A seven-step roadmap from restaurant kitchens to paid private clients, with the graduation criteria for each step.</desc>
<rect width="480" height="2058" fill="#f4efe2"/>
<path d="M 46 246 C 62 315 62 385 46 454 C 30 522 30 593 46 662 C 62 730 62 801 46 869 C 30 938 30 1008 46 1077 C 62 1146 62 1216 46 1285 C 30 1353 30 1424 46 1492 C 62 1561 62 1632 46 1700 C 30 1769 30 1839 46 1908" fill="none" stroke="#b9bfae" stroke-width="30" stroke-linecap="round"/>
<path d="M 46 246 C 62 315 62 385 46 454 C 30 522 30 593 46 662 C 62 730 62 801 46 869 C 30 938 30 1008 46 1077 C 62 1146 62 1216 46 1285 C 30 1353 30 1424 46 1492 C 62 1561 62 1632 46 1700 C 30 1769 30 1839 46 1908" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="9 11" stroke-linecap="round" opacity="0.9"/>
<text x="46" y="60" font-size="15" font-weight="600" fill="#1a1a17" letter-spacing="2.4">HOW TO BECOME A</text>
<text x="44" y="112" font-size="46" font-weight="800" fill="#1c4b3d" letter-spacing="-0.8">Private Chef</text>
<text x="44" y="146" font-size="17" fill="#5c5850">A 7-step roadmap from restaurant</text>
<text x="44" y="169" font-size="17" fill="#5c5850">kitchens to paid private clients</text>
<text x="456" y="214" font-size="14" font-weight="700" text-anchor="end" fill="#1c4b3d" letter-spacing="0.6">@jordanchanners</text>
<line x1="44" y1="232" x2="456" y2="232" stroke="#1c4b3d" stroke-width="1.5" opacity="0.35"/>
<g>
<circle cx="46" cy="272" r="20" fill="#1c4b3d"/>
<circle cx="46" cy="272" r="20" fill="none" stroke="#f4efe2" stroke-width="3"/>
<text x="46" y="279.5" font-size="20" font-weight="800" fill="#f4efe2" text-anchor="middle">1</text>
<text x="98" y="287" font-size="19" font-weight="700" fill="#1a1a17">Get 3–5 years of restaurant</text>
<text x="98" y="312" font-size="19" font-weight="700" fill="#1a1a17">experience</text>
<text x="98" y="339" font-size="15.5" fill="#5c5850">Master cooking techniques, organization, time</text>
<text x="98" y="360" font-size="15.5" fill="#5c5850">management, and running your station.</text>
<rect x="98" y="378" width="360" height="142" rx="12" fill="#e8ecdd"/>
<rect x="98" y="378" width="4" height="142" rx="2" fill="#1c4b3d" opacity="0.55"/>
<text x="112" y="403" font-size="11" font-weight="700" fill="#1c4b3d" letter-spacing="1.5">GRADUATE WHEN</text>
<text x="112" y="430" font-size="14" font-weight="700" fill="#1c4b3d">1.</text>
<text x="130" y="430" font-size="14" fill="#1c4b3d">Are proficient in cooking techniques</text>
<text x="112" y="449" font-size="14" font-weight="700" fill="#1c4b3d">2.</text>
<text x="130" y="449" font-size="14" fill="#1c4b3d">Can stay organized juggling multiple tasks</text>
<text x="112" y="468" font-size="14" font-weight="700" fill="#1c4b3d">3.</text>
<text x="130" y="468" font-size="14" fill="#1c4b3d">Have good time management</text>
<text x="112" y="487" font-size="14" font-weight="700" fill="#1c4b3d">4.</text>
<text x="130" y="487" font-size="14" fill="#1c4b3d">Can confidently run your station without</text>
<text x="130" y="506" font-size="14" fill="#1c4b3d">supervision</text>
</g>
<g>
<circle cx="46" cy="558" r="20" fill="#1c4b3d"/>
<circle cx="46" cy="558" r="20" fill="none" stroke="#f4efe2" stroke-width="3"/>
<text x="46" y="565.5" font-size="20" font-weight="800" fill="#f4efe2" text-anchor="middle">2</text>
<text x="98" y="573" font-size="19" font-weight="700" fill="#1a1a17">Reach out to your whole network</text>
<text x="98" y="600" font-size="15.5" fill="#5c5850">Instagram, your contacts, Facebook. Find the</text>
<text x="98" y="621" font-size="15.5" fill="#5c5850">people who are interested in private chef</text>
<text x="98" y="642" font-size="15.5" fill="#5c5850">services.</text>
<rect x="98" y="660" width="360" height="85" rx="12" fill="#e8ecdd"/>
<rect x="98" y="660" width="4" height="85" rx="2" fill="#1c4b3d" opacity="0.55"/>
<text x="112" y="685" font-size="11" font-weight="700" fill="#1c4b3d" letter-spacing="1.5">GRADUATE WHEN</text>
<text x="112" y="712" font-size="14" fill="#1c4b3d">You've started having real conversations with</text>
<text x="112" y="731" font-size="14" fill="#1c4b3d">potential clients.</text>
</g>
<g>
<circle cx="46" cy="783" r="20" fill="#1c4b3d"/>
<circle cx="46" cy="783" r="20" fill="none" stroke="#f4efe2" stroke-width="3"/>
<text x="46" y="790.5" font-size="20" font-weight="800" fill="#f4efe2" text-anchor="middle">3</text>
<text x="98" y="798" font-size="19" font-weight="700" fill="#1a1a17">Book your first dinner with</text>
<text x="98" y="823" font-size="19" font-weight="700" fill="#1a1a17">someone you know</text>
<text x="98" y="850" font-size="15.5" fill="#5c5850">Charge only for groceries. This service is</text>
<text x="98" y="871" font-size="15.5" fill="#5c5850">about buying experience.</text>
<rect x="98" y="889" width="360" height="85" rx="12" fill="#e8ecdd"/>
<rect x="98" y="889" width="4" height="85" rx="2" fill="#1c4b3d" opacity="0.55"/>
<text x="112" y="914" font-size="11" font-weight="700" fill="#1c4b3d" letter-spacing="1.5">GRADUATE WHEN</text>
<text x="112" y="941" font-size="14" fill="#1c4b3d">You've successfully completed your first</text>
<text x="112" y="960" font-size="14" fill="#1c4b3d">service.</text>
</g>
<g>
<circle cx="46" cy="1012" r="20" fill="#1c4b3d"/>
<circle cx="46" cy="1012" r="20" fill="none" stroke="#f4efe2" stroke-width="3"/>
<text x="46" y="1019.5" font-size="20" font-weight="800" fill="#f4efe2" text-anchor="middle">4</text>
<text x="98" y="1027" font-size="19" font-weight="700" fill="#1a1a17">Document everything with photos</text>
<text x="98" y="1052" font-size="19" font-weight="700" fill="#1a1a17">and video</text>
<text x="98" y="1079" font-size="15.5" fill="#5c5850">Build a portfolio that shows what you can do.</text>
<rect x="98" y="1097" width="360" height="85" rx="12" fill="#e8ecdd"/>
<rect x="98" y="1097" width="4" height="85" rx="2" fill="#1c4b3d" opacity="0.55"/>
<text x="112" y="1122" font-size="11" font-weight="700" fill="#1c4b3d" letter-spacing="1.5">GRADUATE WHEN</text>
<text x="112" y="1149" font-size="14" fill="#1c4b3d">A stranger could look at your portfolio and</text>
<text x="112" y="1168" font-size="14" fill="#1c4b3d">confidently hire you.</text>
</g>
<g>
<circle cx="46" cy="1220" r="20" fill="#1c4b3d"/>
<circle cx="46" cy="1220" r="20" fill="none" stroke="#f4efe2" stroke-width="3"/>
<text x="46" y="1227.5" font-size="20" font-weight="800" fill="#f4efe2" text-anchor="middle">5</text>
<text x="98" y="1235" font-size="19" font-weight="700" fill="#1a1a17">Repeat at least five more times</text>
<text x="98" y="1260" font-size="19" font-weight="700" fill="#1a1a17">before charging</text>
<text x="98" y="1287" font-size="15.5" fill="#5c5850">The goal is six successful dinners total.</text>
<rect x="98" y="1305" width="360" height="66" rx="12" fill="#e8ecdd"/>
<rect x="98" y="1305" width="4" height="66" rx="2" fill="#1c4b3d" opacity="0.55"/>
<text x="112" y="1330" font-size="11" font-weight="700" fill="#1c4b3d" letter-spacing="1.5">GRADUATE WHEN</text>
<text x="112" y="1357" font-size="14" fill="#1c4b3d">You've completed six successful dinners.</text>
</g>
<g>
<circle cx="46" cy="1409" r="20" fill="#1c4b3d"/>
<circle cx="46" cy="1409" r="20" fill="none" stroke="#f4efe2" stroke-width="3"/>
<text x="46" y="1416.5" font-size="20" font-weight="800" fill="#f4efe2" text-anchor="middle">6</text>
<text x="98" y="1424" font-size="19" font-weight="700" fill="#1a1a17">Keep booking clients and</text>
<text x="98" y="1449" font-size="19" font-weight="700" fill="#1a1a17">delivering</text>
<text x="98" y="1476" font-size="15.5" fill="#5c5850">Deliver amazing experiences until referrals</text>
<text x="98" y="1497" font-size="15.5" fill="#5c5850">drive your business.</text>
<rect x="98" y="1515" width="360" height="85" rx="12" fill="#e8ecdd"/>
<rect x="98" y="1515" width="4" height="85" rx="2" fill="#1c4b3d" opacity="0.55"/>
<text x="112" y="1540" font-size="11" font-weight="700" fill="#1c4b3d" letter-spacing="1.5">GRADUATE WHEN</text>
<text x="112" y="1567" font-size="14" fill="#1c4b3d">Referrals become your primary source of new</text>
<text x="112" y="1586" font-size="14" fill="#1c4b3d">business.</text>
</g>
<g>
<circle cx="46" cy="1638" r="20" fill="#1c4b3d"/>
<circle cx="46" cy="1638" r="20" fill="none" stroke="#f4efe2" stroke-width="3"/>
<text x="46" y="1645.5" font-size="20" font-weight="800" fill="#f4efe2" text-anchor="middle">7</text>
<text x="98" y="1653" font-size="19" font-weight="700" fill="#1a1a17">Use private chef agencies to</text>
<text x="98" y="1678" font-size="19" font-weight="700" fill="#1a1a17">expand your reach</text>
<text x="98" y="1705" font-size="15.5" fill="#5c5850">Grow with agencies while you keep building</text>
<text x="98" y="1726" font-size="15.5" fill="#5c5850">your own client base.</text>
<rect x="98" y="1744" width="360" height="104" rx="12" fill="#e8ecdd"/>
<rect x="98" y="1744" width="4" height="104" rx="2" fill="#1c4b3d" opacity="0.55"/>
<text x="112" y="1769" font-size="11" font-weight="700" fill="#1c4b3d" letter-spacing="1.5">GRADUATE WHEN</text>
<text x="112" y="1796" font-size="14" fill="#1c4b3d">You've built enough momentum to grow with</text>
<text x="112" y="1815" font-size="14" fill="#1c4b3d">private chef agencies while continuing your</text>
<text x="112" y="1834" font-size="14" fill="#1c4b3d">own client base.</text>
</g>
<circle cx="46" cy="1908" r="9" fill="#1c4b3d"/>
<line x1="44" y1="1898" x2="456" y2="1898" stroke="#1c4b3d" stroke-width="1.5" opacity="0.35"/>
<text x="44" y="1944" font-size="19" font-weight="700" fill="#1c4b3d">Build experience first, then turn</text>
<text x="44" y="1970" font-size="19" font-weight="700" fill="#1c4b3d">it into a referral-driven private</text>
<text x="44" y="1996" font-size="19" font-weight="700" fill="#1c4b3d">chef business</text>
<text x="44" y="2028" font-size="13" fill="#5c5850">Brigade. Mentorship for private chefs.</text>
</svg>