name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build-time only. Real values live in Vercel; these exist so env validation
  # and the Next build can run in CI without secrets.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
  NEXT_PUBLIC_API_URL: http://localhost:3000
  JWT_SECRET: ci-build-only-not-a-real-secret

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheapest checks first — they need no build and fail fast.
      - name: Guardrails (no mock data, build errors not silenced)
        run: pnpm check:guardrails

      - name: Architecture boundaries
        run: pnpm check:architecture

      # Required. Brigade's design is informed by reading AGPL software, so a
      # GPL-family dependency arriving through the package tree is the one way
      # that exposure could still happen. See docs/ARCHITECTURE.md.
      - name: License scan
        run: pnpm check:licenses

      - name: Build shared packages
        run: pnpm --filter @connectpro/common build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  build:
    runs-on: ubuntu-latest
    needs: verify
    env:
      HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @connectpro/common build

      # main must always be deployable. With VERCEL_TOKEN configured this builds
      # exactly the way Vercel does, which catches the class of failure that only
      # appears in their environment; without it, fall back to the plain Next
      # build so the gate still exists.
      - name: Vercel build
        if: env.HAS_VERCEL_TOKEN == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          pnpm dlx vercel@latest pull --yes --environment=preview --token="${{ secrets.VERCEL_TOKEN }}"
          pnpm dlx vercel@latest build --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Next build (fallback)
        if: env.HAS_VERCEL_TOKEN != 'true'
        run: pnpm --filter @connectpro/web build

      # WCAG 2.0 AA is enforceable for Ontario organisations under AODA, and
      # retrofitting accessibility costs roughly ten times what building with
      # it does. Public pages only for now — authenticated pages need a
      # fixture session.
      - name: Accessibility (axe-core)
        run: |
          npx playwright install --with-deps chromium
          pnpm --filter @connectpro/web start &
          npx wait-on http://localhost:3100 --timeout 60000
          pnpm check:a11y

  schema:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brigade
          POSTGRES_PASSWORD: brigade
          POSTGRES_DB: brigade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Every migration applies from scratch, in order, on the same Postgres
      # major version as production.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Through the real migration runner, so the thing that runs on deploy is
      # the thing CI exercises.
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://brigade:brigade@localhost:5432/brigade_test
        run: pnpm db:migrate

      - name: Migrations are idempotent
        env:
          DATABASE_URL: postgresql://brigade:brigade@localhost:5432/brigade_test
        run: pnpm db:migrate | grep -q "nothing to do"

      # The service layer, exercised against the schema that was just built.
      # Tests target the services rather than HTTP endpoints — that is the
      # whole point of having a service layer.
      - name: Core specs
        env:
          CORE_DATABASE_URL: postgresql://brigade:brigade@localhost:5432/brigade_test
          CORE_REDIS_URL: redis://localhost:6379
        run: |
          node --experimental-strip-types packages/core/spec/service_layer.spec.ts
          node --experimental-strip-types packages/core/spec/directory_and_verification.spec.ts
          node --experimental-strip-types packages/core/spec/feeds_and_moderation.spec.ts
          node --experimental-strip-types streaming/spec/streaming.spec.ts
